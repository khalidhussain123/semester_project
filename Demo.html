<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Password Strength Meter</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: background 0.4s ease;
    }

    /* Default theme */
    body.theme-1 {
      background: linear-gradient(135deg, #667eea, #764ba2);
    }

    body.theme-2 {
      background: linear-gradient(135deg, #ff7e5f, #feb47b);
    }

    body.theme-3 {
      background: linear-gradient(135deg, #43cea2, #185a9d);
    }

    body.theme-4 {
      background: linear-gradient(135deg, #ff9966, #ff5e62);
    }

    body.theme-5 {
      background: linear-gradient(135deg, #00c6ff, #0072ff);
    }

    .container {
      width: 360px;
      padding: 30px;
      border-radius: 20px;
      backdrop-filter: blur(15px);
      background: rgba(255, 255, 255, 0.1);
      box-shadow: 0 8px 32px rgba(0,0,0,0.25);
      color: #fff;
    }

    .title {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 20px;
      text-align: center;
    }

    .input-group {
      position: relative;
      margin-bottom: 15px;
    }

    input {
      width: 100%;
      padding: 12px 45px 12px 12px;
      border-radius: 10px;
      border: none;
      outline: none;
      font-size: 14px;
      background: rgba(255,255,255,0.2);
      color: #fff;
    }

    input::placeholder {
      color: rgba(255,255,255,0.7);
    }

    .toggle-btn {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #fff;
      cursor: pointer;
      font-size: 12px;
    }

    .strength {
      margin-top: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .badge {
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      transition: 0.3s;
    }

    .bar {
      height: 6px;
      width: 100%;
      border-radius: 5px;
      margin-top: 10px;
      background: rgba(255,255,255,0.2);
      overflow: hidden;
    }

    .progress {
      height: 100%;
      width: 0%;
      border-radius: 5px;
      transition: all 0.3s ease;
    }

    .weak { background: #ff4d4d; }
    .medium { background: #ffb84d; }
    .strong { background: #4dff88; }

    /* Theme selector */
    .themes {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
    }

    .theme-btn {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid #fff;
      opacity: 0.7;
      transition: 0.3s;
    }

    .theme-btn.active {
      transform: scale(1.2);
      opacity: 1;
    }

    .t1 { background: #667eea; }
    .t2 { background: #ff7e5f; }
    .t3 { background: #43cea2; }
    .t4 { background: #ff5e62; }
    .t5 { background: #0072ff; }

  </style>
</head>

<body class="theme-1">

  <div class="container">
    <div class="title">Password Strength</div>

    <div class="input-group">
      <input id="password" type="password" placeholder="Enter password..." />
      <button class="toggle-btn" id="toggleBtn">Show</button>
    </div>

    <div class="strength">
      <span>Strength:</span>
      <span class="badge" id="badge">-</span>
    </div>

    <div class="bar">
      <div class="progress" id="progress"></div>
    </div>

    <!-- Theme Selector -->
    <div class="themes">
      <div class="theme-btn t1 active" data-theme="theme-1"></div>
      <div class="theme-btn t2" data-theme="theme-2"></div>
      <div class="theme-btn t3" data-theme="theme-3"></div>
      <div class="theme-btn t4" data-theme="theme-4"></div>
      <div class="theme-btn t5" data-theme="theme-5"></div>
    </div>
  </div>

  <script>
    const input = document.getElementById("password");
    const badge = document.getElementById("badge");
    const progress = document.getElementById("progress");
    const toggleBtn = document.getElementById("toggleBtn");
    const themeButtons = document.querySelectorAll(".theme-btn");

    function getStrength(password) {
      if (!password) return null;

      if (password.length < 6) return "Weak";
      if (password.length >= 6 && password.length <= 9) return "Medium";
      if (password.length >= 10 && /[@#]/.test(password)) return "Strong";

      return "Medium";
    }

    function updateUI(strength) {
      badge.className = "badge";
      progress.className = "progress";

      if (!strength) {
        badge.textContent = "-";
        progress.style.width = "0%";
        return;
      }

      badge.textContent = strength;

      if (strength === "Weak") {
        badge.classList.add("weak");
        progress.classList.add("weak");
        progress.style.width = "33%";
      }

      if (strength === "Medium") {
        badge.classList.add("medium");
        progress.classList.add("medium");
        progress.style.width = "66%";
      }

      if (strength === "Strong") {
        badge.classList.add("strong");
        progress.classList.add("strong");
        progress.style.width = "100%";
      }
    }

    input.addEventListener("input", () => {
      const value = input.value.trim();
      if (!value) return updateUI(null);
      updateUI(getStrength(value));
    });

    toggleBtn.addEventListener("click", () => {
      if (input.type === "password") {
        input.type = "text";
        toggleBtn.textContent = "Hide";
      } else {
        input.type = "password";
        toggleBtn.textContent = "Show";
      }
    });

    // Theme switching
    themeButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        document.body.className = btn.dataset.theme;

        themeButtons.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
      });
    });
  </script>

</body>
</html>
